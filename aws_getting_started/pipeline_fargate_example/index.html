<!DOCTYPE html>
<html>
<head>
    <title>Fargate Application</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #f0f0f0;
        }
        .container {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            display: inline-block;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Fargate Application</h1>
        <p>This is a sample application running on AWS Fargate</p>
        <p>Environment: <strong id="stage">Loading...</strong></p>
        <p>Deployed via CDK Pipeline</p>
    </div>
    
    <script>
        // This would normally get the stage from an environment variable
        // For demo purposes, we'll detect it from the hostname
        const hostname = window.location.hostname;
        let stage = 'unknown';
        
        if (hostname.includes('alpha')) {
            stage = 'Alpha (us-east-1)';
        } else if (hostname.includes('beta')) {
            stage = 'Beta (us-east-2)';
        } else if (hostname.includes('prod')) {
            stage = 'Production (us-west-2)';
        }
        
        document.getElementById('stage').textContent = stage;
    </script>
</body>
</html>
